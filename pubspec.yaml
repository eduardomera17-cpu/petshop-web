name: mipetshop
description: Aplicación web de gestión de citas, atención clínica y venta en mostrador para un petshop (Flutter Web + Firebase).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cloud_firestore: '>=4.17.0'
  firebase_app_check: '>=0.4.6'
  firebase_core: '>=2.27.0'
  firebase_auth: '>=4.17.0'
  firebase_storage: '>=11.6.0'
  cloud_functions: '>=4.6.0'
  provider: '>=6.1.0'
  go_router: '>=13.2.0'
  # Tope <3.0.0: la 4.0.0-dev.3 es una versión preliminar y la 4.0.1 estable exige un analyzer
  # más reciente que el que resuelve el resto de dependencias.
  freezed_annotation: '>=2.4.0 <3.0.0'
  json_annotation: '>=4.9.0'
  intl: '>=0.19.0'
  timezone: '>=0.9.2'
  web: '>=0.5.0'

# Solo generación de código (freezed / json_serializable) y reglas de análisis.
dev_dependencies:
  # Mismo tope que freezed_annotation.
  freezed: '>=2.4.0 <3.0.0'
  build_runner: '>=2.4.0'
  json_serializable: '>=6.9.0'
  flutter_lints: '>=3.0.0'

flutter:
  uses-material-design: true
  generate: true              # gen-l10n: genera lib/l10n/app_localizations*.dart desde los .arb
